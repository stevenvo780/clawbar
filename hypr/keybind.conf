# clawbar — Hyprland keybind snippet.
#
# Push-to-talk / VAD toggle for the Claw voice bridge. install.sh adds this to
# your hyprland.conf ONLY if no bind for `claw-talk` exists yet (so it won't
# duplicate an existing SUPER SHIFT V bind). $mainMod is the standard Hyprland
# modifier variable (usually SUPER); change the key if it clashes.
bind = $mainMod SHIFT, V, exec, claw-talk toggle   # Claw voice (toggle listen / VAD)
bind = $mainMod SHIFT, M, exec, claw-talk mute      # Claw: mutear / desmutear el micrófono
bind = $mainMod SHIFT, O, exec, claw-talk eyes      # Claw: tapar / abrir los ojos (screen vision)
bind = $mainMod SHIFT, P, exec, claw-talk privacy   # Claw: privacidad total (mic + ojos OFF)

# Autostart opcional ("dejarlo iniciado"): al entrar a Hyprland levanta el stack
# de Claw (best-effort; arranca los contenedores ya existentes si están parados).
exec-once = claw-up
